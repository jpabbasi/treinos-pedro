<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treinos Pedro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: coluna única de celular. Abas dos dias, barra de progresso fixa, um cartão por exercício com linhas de série (kg, reps, check). */
:root {
  --bg: #f4f3f7;
  --surface: #ffffff;
  --surface2: #ecebf2;
  --fg: #1c1a22;
  --muted: #6b6677;
  --line: #dcd8e5;
  --accent: #0e6f8c;
  --accent-fg: #ffffff;
  --ok: #17794f;
  --ok-bg: #ddf3e8;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141118; --surface: #1e1a24; --surface2: #29232f; --fg: #f1eef5; --muted: #a39cb0;
    --line: #372f40; --accent: #6cc4e0; --accent-fg: #06232d; --ok: #55d69a; --ok-bg: #17352a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141118; --surface: #1e1a24; --surface2: #29232f; --fg: #f1eef5; --muted: #a39cb0;
  --line: #372f40; --accent: #6cc4e0; --accent-fg: #06232d; --ok: #55d69a; --ok-bg: #17352a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.4;
  padding-block: 12px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--bg); z-index: 10;
}
.wrap { max-width: 560px; margin: 0 auto; min-width: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1;
  text-transform: uppercase; letter-spacing: 0.03em; margin: 0;
}
.status { font-size: 12px; color: var(--muted); margin-top: 4px; min-height: 16px; }
.date {
  background: var(--surface2); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; min-height: 40px; color: var(--fg);
}

.views { display: flex; gap: 6px; margin-top: 14px; }
.views button {
  flex: 1; min-height: 40px; border-radius: 10px; border: 1px solid var(--line);
  background: transparent; color: var(--muted); font-weight: 600;
}
.views button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.tabs { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 10px; }
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  min-height: 54px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); padding: 4px 2px; min-width: 0;
}
.tab b { font-family: var(--display); font-size: 18px; font-weight: 700; line-height: 1; text-transform: uppercase; letter-spacing: 0.03em; }
.tab span { font-family: var(--display); font-size: 12px; font-weight: 500; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.tab[aria-selected="true"] span { color: var(--accent-fg); opacity: 0.85; }

.day { margin-top: 18px; }
h2 { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.05; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.place { border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; font-size: 13px; font-weight: 500; color: var(--fg); }

.prog {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 10px; margin-top: 8px;
}
.prog-row { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 99px; background: var(--surface2); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width 0.25s; }

.cards { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; min-width: 0; }
.ex-head { display: flex; gap: 12px; align-items: flex-start; }
.ex-n {
  flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--surface2);
  display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 17px;
}
.ex.complete .ex-n { background: var(--ok-bg); color: var(--ok); }
.ex h3 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.25; }
.target { margin: 2px 0 0; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.target b { color: var(--fg); font-weight: 600; }
.note { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.last { margin: 10px 0 0; font-size: 14px; background: var(--surface2); border-radius: 10px; padding: 8px 10px; font-variant-numeric: tabular-nums; }
.last em { font-style: normal; color: var(--muted); }
.hint { margin: 6px 0 0; font-size: 14px; font-weight: 600; color: var(--accent); }

.sets { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.set, .set-head { display: grid; gap: 8px; align-items: center; grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1fr) 46px; }
.set.one, .set-head.one { grid-template-columns: 28px minmax(0, 1fr) 46px; }
.set-head { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; text-align: center; }
.set { border-radius: 12px; padding: 2px; transition: background 0.2s; }
.set.done { background: var(--ok-bg); }
.sn { text-align: center; font-family: var(--display); font-weight: 600; font-size: 18px; color: var(--muted); }
.set input {
  width: 100%; min-width: 0; height: 44px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface2); text-align: center; font-size: 18px; font-weight: 600;
  font-variant-numeric: tabular-nums; color: var(--fg);
}
.set input::placeholder { color: var(--muted); opacity: 0.55; font-weight: 500; }
.chk {
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: transparent;
  display: grid; place-items: center; color: transparent; justify-self: center; padding: 0;
}
.chk svg { width: 22px; height: 22px; }
.set.done .chk { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.ex-actions { display: flex; gap: 8px; margin-top: 10px; }
.ghost {
  min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
  background: transparent; color: var(--muted); font-size: 14px; font-weight: 600;
}
.ghost:disabled { opacity: 0.4; cursor: default; }

details.howto { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
details.howto summary { font-weight: 600; cursor: pointer; }
details.howto ul { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }

.sec-title { font-family: var(--display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: 0.03em; margin: 22px 0 8px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 18px 14px; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.rec { display: flex; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-variant-numeric: tabular-nums; }
.rec span:first-child { min-width: 0; }
.rec b { font-weight: 600; white-space: nowrap; }
details.sess { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
details.sess summary { cursor: pointer; font-weight: 600; display: flex; justify-content: space-between; gap: 12px; }
details.sess summary span:last-child { color: var(--muted); font-weight: 500; white-space: nowrap; }
details.sess dl { margin: 10px 0 0; display: grid; gap: 8px; }
details.sess dt { font-weight: 600; font-size: 15px; }
details.sess dd { margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

#rest {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--fg); color: var(--bg);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#rest .in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
#rest .lbl { flex: 1; min-width: 0; font-size: 13px; opacity: 0.8; }
#rest .lbl div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#restTime { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
#rest button { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid currentColor; background: transparent; color: var(--bg); font-weight: 600; }
.mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; margin-top: 12px; }
.mf { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mf-l { font-weight: 600; font-size: 14px; }
.mf em { font-style: normal; color: var(--muted); font-weight: 500; }
.mf input {
  width: 100%; min-width: 0; height: 44px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface2); text-align: center; font-size: 18px; font-weight: 600; color: var(--fg);
  font-variant-numeric: tabular-nums;
}
.mf input::placeholder { color: var(--muted); opacity: 0.55; font-weight: 500; }
.mf small { color: var(--muted); font-size: 12px; line-height: 1.3; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin-top: 10px; }
.chart svg { width: 100%; height: auto; display: block; }
.c-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.c-dot { fill: var(--accent); }
.c-mens { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.mens {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; margin-top: 14px;
  padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: transparent;
  color: var(--fg); font-weight: 600; text-align: left;
}
.mens-dot { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); }
.mens[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.mens[aria-checked="true"] .mens-dot { background: var(--accent-fg); border-color: var(--accent-fg); }
.c-grid { stroke: var(--line); stroke-width: 1; fill: none; }
.c-txt { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.c-val { fill: var(--fg); font-size: 12px; font-weight: 600; font-family: var(--body); }
.photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.slot { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.slot-l { font-size: 13px; font-weight: 600; color: var(--muted); }
.pic { position: relative; aspect-ratio: 3 / 4; border-radius: 12px; border: 1px dashed var(--line); background: var(--surface2); overflow: hidden; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; }
.pic img { width: 100%; height: 100%; object-fit: contain; display: block; }
.pic.has { border-style: solid; }
.pic input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.pic:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.slot .ghost { min-height: 34px; padding: 0 8px; font-size: 13px; }
.cmp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.cmp figure { margin: 0; min-width: 0; }
.cmp figcaption { font-size: 13px; font-weight: 600; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.cmp .pic { cursor: default; border-style: solid; }
.cmp-pose { margin: 14px 0 6px; font-family: var(--display); font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: 0.03em; }
.sel { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 40px; color: var(--fg); max-width: 100%; }
.cmp-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 8px; }
.cal-head b { font-family: var(--display); font-size: 22px; text-transform: uppercase; letter-spacing: 0.03em; }
.cal-head button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: transparent; font-size: 22px; line-height: 1; color: var(--fg); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-w { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 0; }
.cal-e { min-height: 48px; }
.cal-d { min-height: 48px; border-radius: 12px; border: 1px solid transparent; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; font-variant-numeric: tabular-nums; }
.cal-d .n { font-size: 14px; font-weight: 600; line-height: 1; }
.cal-d.today { border-color: var(--muted); }
.cal-d.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.dot { display: block; width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box; border: 2px solid transparent; }
.dot.w { background: var(--accent); }
.dot.c { border-color: var(--ok); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.card-sum { display: grid; gap: 6px; margin-top: 12px; }
.cardio-in { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.cardio-in input { width: 110px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); padding: 0 12px; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.crop-back { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.62); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 12px; }
.crop { background: var(--bg); color: var(--fg); border-radius: 16px; padding: 14px; width: 100%; max-width: 420px; max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.crop h2 { margin: 0; font-family: var(--display); font-size: 22px; text-transform: uppercase; letter-spacing: 0.03em; }
.crop canvas { display: block; margin: 0 auto; border-radius: 10px; touch-action: none; background: var(--surface2); cursor: grab; }
.crop canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.crop .hint { margin: 0; font-size: 13px; color: var(--muted); }
.crop-row { display: flex; align-items: center; gap: 10px; }
.crop-row input[type=range] { flex: 1; min-width: 0; min-height: 44px; accent-color: var(--accent); }
.crop-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.crop-actions .ghost { flex: 1; }
.crop-actions .primary { flex: 2; min-height: 44px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 16px; }
.slot-btns { display: flex; flex-direction: column; gap: 6px; }
.top-r { position: relative; display: flex; align-items: center; gap: 4px; }
.more { width: 40px; height: 40px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--muted); display: grid; place-items: center; padding: 0; }
.more[aria-expanded="true"] { border-color: var(--line); color: var(--fg); }
.menu { position: absolute; right: 0; top: 46px; z-index: 30; min-width: 190px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); }
.menu button { display: block; width: 100%; text-align: left; min-height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; font-weight: 600; }
.menu button:hover { background: var(--surface2); }
.dlg-tx { width: 100%; min-height: 130px; max-height: 40vh; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--fg); padding: 8px 10px; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; resize: vertical; }
.chk-row { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.crop input[type=file] { font-size: 13px; max-width: 100%; }
.pick { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.pick h3 { margin: 0 0 4px; font-size: 16px; }
.pick p { margin: 0 0 6px; color: var(--muted); font-size: 14px; }
.pick-b { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; min-height: 52px; margin-top: 8px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--fg); text-align: left; }
.pick-b b { font-size: 15px; }
.pick-b span { font-size: 12px; color: var(--muted); }
.pick-note { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; padding: 10px 12px; border-radius: 12px; border: 1px dashed var(--line); color: var(--muted); font-size: 13px; }
.pick-note button { flex: none; min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); }
.warn { margin-top: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid #c0392b; background: rgba(192,57,43,.12); color: var(--fg); font-size: 14px; line-height: 1.4; }
.slot > .slot-l { display: flex; align-items: center; min-height: 32px; }
.slot-edit { display: flex; align-items: center; gap: 4px; min-height: 32px; margin: 0; padding: 0; border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 600; text-align: left; text-decoration: underline dotted; text-underline-offset: 3px; white-space: nowrap; }
.slot-edit svg { flex: none; width: 12px; height: 12px; }
.slot-edit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.pd-in { width: 100%; min-height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--fg); font-size: 16px; }
.pd-err { min-height: 20px; margin: 0; color: #c0392b; font-size: 13px; }
.pd-toast { position: fixed; left: 12px; right: 12px; margin: 0 auto; max-width: 420px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
.pd-toast button { flex: none; min-height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--accent); font-weight: 700; font-size: 14px; }
.pic-wrap { position: relative; }
.pic-zoom { position: absolute; top: 0; right: 0; width: 44px; height: 44px; margin: 0; padding: 0; border: 0; background: none; display: grid; place-items: center; color: #fff; }
.pic-zoom svg { width: 26px; height: 26px; padding: 5px; box-sizing: border-box; border-radius: 8px; background: rgba(0, 0, 0, 0.55); }
.pic-zoom:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 10px; }
.pic-open { cursor: zoom-in; }
.pic-zoom-deco { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; color: #fff; pointer-events: none; }
.pic-zoom-deco svg { display: block; width: 100%; height: 100%; padding: 5px; box-sizing: border-box; border-radius: 8px; background: rgba(0, 0, 0, 0.55); }
.pv-back { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 80; background: rgba(0, 0, 0, 0.96); color: #fff; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-animation: pvfade 0.15s ease-out; animation: pvfade 0.15s ease-out; }
@-webkit-keyframes pvfade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pvfade { from { opacity: 0; } to { opacity: 1; } }

  var SWAP_DAY = { sab: "dom", dom: "sab" };

  function cleanDoc(id, d) {

    var m, out;
    if ((m = /^(\d{4}-\d{2}-\d{2})_([a-z]+)$/.exec(id))) {
      if (d.kind || !PLAN[m[2]] || !d.sets || typeof d.sets !== "object") return null;
      var sets = {};
      Object.keys(d.sets).forEach(function (k) {
        var arr = d.sets[k]; if (!Array.isArray(arr)) return;

      });
      out = { date: m[1], day: m[2], sets: sets };
    } else if ((m = /^m_(\d{4}-\d{2}-\d{2})$/.exec(id))) {
      if (d.kind !== "medidas" || !d.v || typeof d.v !== "object") return null;
      var v = {};

      out = { kind: "medidas", date: m[1], v: v };
      if (d.mens) out.mens = true;
    } else if ((m = /^c_(\d{4}-\d{2}-\d{2})$/.exec(id))) {
      var mn = cleanNum(d.min);
      if (d.kind !== "cardio" || mn == null || mn > 1440) return null;
      out = { kind: "cardio", date: m[1], min: Math.round(mn) };
    } else if ((m = /^p_(inicio|atual)_(frente|lado|costas)$/.exec(id))) {
      if (d.kind !== "foto" || typeof d.img !== "string" || d.img.indexOf("data:image/jpeg;base64,") !== 0 || d.img.length > 200000) return null;
      out = { kind: "foto", set: m[1], pose: m[2], date: typeof d.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d.date) ? d.date : todayStr(), img: d.img };

  function parseImport(text) {

      schema = +j.schema || 0;
      if (Array.isArray(j.docs)) fromList(j.docs);
      else { var src = j.docs && typeof j.docs === "object" ? j.docs : j; Object.keys(src).forEach(function (id) { if (src[id] && typeof src[id] === "object") map[id] = src[id]; }); }
    } else return { err: "Não achei dados nesse texto." };
    var items = {}, bad = 0, total = 0;
    Object.keys(map).forEach(function (id) { total++; var c = cleanDoc(id, map[id]); if (c) items[id] = c; else bad++; });
    if (!total) return { err: "Não achei nenhuma anotação nesse texto." };
    return { items: items, bad: bad, total: total, schema: schema };
  }
  function planImport(res, opts) {
    var out = {}, c = { s: [0, 0], m: [0, 0], c: [0, 0], f: [0, 0], conv: 0, keep: 0, nofoto: 0 };
    Object.keys(res.items).forEach(function (id) {
      var d = res.items[id], nid = id;
      if (opts.convert && APP.swapFrom && !d.kind && d.date < APP.swapFrom && SWAP_DAY[d.day]) { d = clone(d); d.day = SWAP_DAY[d.day]; nid = d.date + "_" + d.day; c.conv++; }
      var k = d.kind === "foto" ? "f" : d.kind === "medidas" ? "m" : d.kind === "cardio" ? "c" : "s";
      if (k === "f" && store.mode !== "db") { c.nofoto++; return; }
      var exists = !!S.docs[nid];
      if (exists && !opts.over) { c.keep++; return; }
      c[k][exists ? 1 : 0]++;
      out[nid] = d;
    });
    return { list: Object.keys(out).map(function (id) { return [id, out[id]]; }), c: c };
  }
  function previewText(res, pl, opts) {
    var c = pl.c, p = [];
    function line(label, a) { if (a[0] || a[1]) p.push(label + ": " + a[0] + " novas" + (a[1] ? ", " + a[1] + " substituindo as que já existem" : "")); }
    line("Sessões de treino", c.s); line("Medidas", c.m); if (APP.cardio) line("Cardio", c.c); line("Fotos", c.f);
    var s = p.length ? p.join(". ") + "." : "Nada para importar.";
    if (c.keep) s += " " + c.keep + (c.keep === 1 ? " item já existe aqui e será mantido." : " itens já existem aqui e serão mantidos.");
    if (c.conv) s += " " + c.conv + (c.conv === 1 ? " sessão de sábado ou domingo anterior a 21/11 será trocada" : " sessões de sábado ou domingo anteriores a 21/11 serão trocadas") + " para a nova ordem.";
    if (c.nofoto) s += " " + c.nofoto + " foto(s) ficaram de fora porque o app não está conectado à sua conta.";
    if (res.bad) s += " " + res.bad + (res.bad === 1 ? " item não reconhecido foi ignorado." : " itens não reconhecidos foram ignorados.");
    return s;
  }
  function applyImport(list, done) {
    var prev = {}, ok = 0, fail = 0, i = 0;
    bkSoon();
    list.forEach(function (it) { prev[it[0]] = S.docs[it[0]]; });
    function undo(id) { if (prev[id]) S.docs[id] = prev[id]; else delete S.docs[id]; }
    if (store.mode === "local") {
      list.forEach(function (it) { S.docs[it[0]] = it[1]; });
      Promise.resolve(store.save()).then(function () { done(list.length, 0); }, function () { list.forEach(function (it) { undo(it[0]); }); done(0, list.length); });
      return;
    }
    (function next() {
      if (i >= list.length) { done(ok, fail); return; }
      var id = list[i][0], doc = list[i][1]; i++;
      S.docs[id] = doc;
      Promise.resolve(store.save(id, clone(doc))).then(function () { ok++; }, function () { fail++; undo(id); }).then(next);
    })();
  }
  function openImport() {
    if (!store) { setStatus("Ainda conectando. Tente de novo em instantes."); return; }
    dlgOpen('<h2>Importar dados</h2><p class="hint">Cole o texto exportado (deste app ou do app antigo) ou escolha o arquivo. Por padrão, nada que já existe aqui é apagado.</p>' +
      '<textarea class="dlg-tx" id="impTx" spellcheck="false" placeholder="Cole aqui" aria-label="Dados para importar"></textarea>' +
      '<input type="file" id="impFile" accept=".json,.txt,application/json,text/plain" aria-label="Escolher arquivo">' +
      '<div id="impOpts"></div>' +
      '<div class="crop-actions"><button type="button" class="ghost" id="dlgX">Fechar</button><button type="button" class="ghost" id="impCheck">Conferir</button><button type="button" class="primary" id="impGo" disabled>Importar</button></div>' +
      '<p class="hint" id="impMsg" role="status"></p>');
    var res = null, msg = $("impMsg"), go = $("impGo");
    function opts() { var o = $("impOver"), v = $("impConv"); return { over: !!(o && o.checked), convert: !!(v && v.checked) }; }
    function refresh() {
      if (!res) return;
      var o = opts(), pl = planImport(res, o);
      msg.textContent = previewText(res, pl, o);
      go.disabled = !pl.list.length;
    }
    function check() {
      res = parseImport($("impTx").value);
      if (res.err) { $("impOpts").innerHTML = ""; msg.textContent = res.err; go.disabled = true; res = null; return; }
      var h = '<label class="hint chk-row"><input type="checkbox" id="impOver"> Se já existir aqui, substituir pelo que está sendo importado</label>';
      if (APP.swapFrom && res.schema < 2) h += '<label class="hint chk-row"><input type="checkbox" id="impConv" checked> Dados do app antigo: trocar sábado e domingo anteriores a 21/11 para a nova ordem</label>';
      $("impOpts").innerHTML = h;
      var a = $("impOver"), b = $("impConv");
      if (a) a.addEventListener("change", refresh); if (b) b.addEventListener("change", refresh);
      refresh();
    }
    $("impTx").addEventListener("input", function () { res = null; go.disabled = true; $("impOpts").innerHTML = ""; msg.textContent = ""; });
    $("impFile").addEventListener("change", function (e) {
      var f = e.target.files && e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () { $("impTx").value = String(r.result || ""); check(); };
      r.onerror = function () { msg.textContent = "Não consegui ler o arquivo."; };
      r.readAsText(f);
    });
    $("impCheck").addEventListener("click", check);
    $("dlgX").addEventListener("click", dlgClose);
    go.addEventListener("click", function () {
      if (!res) return;
      var pl = planImport(res, opts());
      if (!pl.list.length) { msg.textContent = "Nada novo para importar."; return; }
      go.disabled = true; $("impCheck").disabled = true; msg.textContent = "Importando…";
      applyImport(pl.list, function (ok, fail) {
        $("impCheck").disabled = false; res = null;
        msg.textContent = "Importado: " + ok + (ok === 1 ? " item." : " itens.") + (fail ? " " + fail + " não puderam ser salvos, tente de novo." : "");
        var active = document.activeElement; if (!(active && active.matches && active.matches("input[data-f]"))) render();
        setStatus(store.mode === "local" ? "Salvo só neste aparelho" : "Salvo na sua conta");
      });
    });
    $("impTx").focus();
  }

  /* ---------- descanso ---------- */
  var rest = { end: 0, iv: 0, hide: 0 };
  var restEl = document.getElementById("rest"), restTime = document.getElementById("restTime"), restName = document.getElementById("restName");
  function tickRest() {
    var left = Math.ceil((rest.end - Date.now()) / 1000);
    if (left <= 0) {
      clearInterval(rest.iv); rest.iv = 0;
      restTime.textContent = "0:00"; restName.textContent = "Pronto para a próxima série";
      try { if (navigator.vibrate) navigator.vibrate(200); } catch (e) {}
      rest.hide = setTimeout(function () { restEl.hidden = true; }, 8000);
      return;
    }
    restTime.textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
  }
  function startRest(ex) {
    clearTimeout(rest.hide); clearInterval(rest.iv);
    rest.end = Date.now() + restSecs(ex) * 1000;
    restName.textContent = ex.name; restEl.hidden = false;
    tickRest(); rest.iv = setInterval(tickRest, 250);
  }
  document.getElementById("restAdd").addEventListener("click", function () {
    if (!rest.iv) { rest.end = Date.now(); }
    rest.end += 30000; clearTimeout(rest.hide);
    if (!rest.iv) rest.iv = setInterval(tickRest, 250);
    tickRest();
  });
  document.getElementById("restSkip").addEventListener("click", function () {
    clearInterval(rest.iv); rest.iv = 0; clearTimeout(rest.hide); restEl.hidden = true;
  });

  /* ---------- eventos ---------- */
  app.addEventListener("input", function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.cardio) {
      var cm = parse(t.value), cid = "c_" + S.date;
      if (cm == null && !S.docs[cid]) return;
      S.docs[cid] = { kind: "cardio", date: S.date, min: cm == null ? 0 : Math.round(cm), updatedAt: new Date().toISOString() };
      scheduleSave(cid);
      var cs = document.getElementById("cardioSum"); if (cs) cs.innerHTML = cardioSumHtml();
      return;
    }
    if (t.matches && t.matches("input[data-m]")) {
      var md = medDoc(true); md.v[t.dataset.m] = parse(t.value); md.updatedAt = new Date().toISOString(); scheduleSave(medId()); return;
    }
    if (!t.matches || !t.matches("input[data-f]")) return;
    var ex = exOf(t.dataset.ex); if (!ex) return;
    setsFor(ex, true)[+t.dataset.i][t.dataset.f] = parse(t.value);
    touch();
  });
  app.addEventListener("change", function (e) {
    if (e.target.dataset && e.target.dataset.photo) { handlePhoto(e.target); return; }
    if (e.target.dataset && e.target.dataset.m) { var ms = document.getElementById("medSummary"); if (ms) ms.innerHTML = medSummaryHtml(); return; }
    if (e.target.id === "date") {
      S.date = e.target.value || todayStr(); S.day = S.day === "extra" ? "extra" : dayFor(S.date); render();
    }
  });
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.view) { S.view = b.dataset.view; S.confirmDel = null; render(); return; }
    if (b.dataset.day) { S.day = b.dataset.day; render(); return; }
    var act = b.dataset.act; if (!act) return;
    if (act === "pickback") { S.day = dayForDate(S.date); render(); return; }
    if (act === "more") { S.menu = !S.menu; render(); return; }
    if (act === "bk") { S.menu = false; render(); openBackup(); return; }
    if (act === "exp") { S.menu = false; render(); openExport(); return; }
    if (act === "imp") { S.menu = false; render(); openImport(); return; }
    if (act === "calprev" || act === "calnext") {
      var dm = act === "calprev" ? -1 : 1, nm = new Date(S.hm.y, S.hm.m + dm, 1);
      S.hm = { y: nm.getFullYear(), m: nm.getMonth() }; S.hsel = null; render(); return;
    }
    if (act === "calday") { S.hsel = S.hsel === b.dataset.date ? null : b.dataset.date; render(); return; }
    if (act === "goday") {
      S.date = b.dataset.date; S.day = dayForDate(S.date);
      Object.keys(S.docs).forEach(function (id) { var d = S.docs[id]; if (!d.kind && d.date === S.date && d.sets && PLAN[d.day] && Object.keys(d.sets).some(function (k) { return d.sets[k].some(hasData); })) S.day = d.day; }); S.view = "treino"; render(); window.scrollTo(0, 0); return; }
    if (act === "photodate") { openPhotoDate(b.dataset.id); return; }
    if (act === "viewfoto") { openViewer(b.dataset.id); return; }
    if (act === "adjfoto") {
      var ad = S.docs[b.dataset.id];
      if (ad && ad.img) openCrop({ set: ad.set, pose: ad.pose, url: ad.img, date: ad.date });
      return;
    }
    if (act === "unlock") { S.unlock = S.unlock === b.dataset.id ? null : b.dataset.id; render(); return; }
    if (act === "delfoto") {
      var pid = b.dataset.id;
      if (S.confirmDel === pid) { S.confirmDel = null; removePhoto(pid); }
      else { S.confirmDel = pid; render(); }
      return;
    }
    if (act === "mens") {
      var mdoc = medDoc(true); mdoc.mens = !mdoc.mens; mdoc.updatedAt = new Date().toISOString(); scheduleSave(medId());
      b.setAttribute("aria-checked", String(mdoc.mens));
      var msum = document.getElementById("medSummary"); if (msum) msum.innerHTML = medSummaryHtml();
      return;
    }
    var ex = exOf(b.dataset.ex); if (!ex) return;
    var arr = setsFor(ex, true), type = ex.type || "load";
    if (act === "add") {
      arr.push({ kg: null, reps: null, done: false }); touch(); render(); return;
    }
    if (act === "rm") {
      if (arr.length > 1) { arr.pop(); touch(); render(); } return;
    }
    if (act === "chk") {
      var i = +b.dataset.i, s = arr[i];
      s.done = !s.done;
      if (s.done) {
        var ph = placeholders(ex, i, lastFor(ex));
        if (type === "load" && s.kg == null && ph.kg != null) { s.kg = ph.kg; var k = document.getElementById("kg-" + ex.id + "-" + i); if (k) k.value = fmt(s.kg); }
        if (s.reps == null && ph.reps != null) { s.reps = ph.reps; var r = document.getElementById("rp-" + ex.id + "-" + i); if (r) r.value = fmt(s.reps); }
        startRest(ex);
      }
      var row = b.closest(".set"); row.classList.toggle("done", s.done); b.setAttribute("aria-pressed", String(s.done));
      touch(); updateProgress();
    }
  });

  render();
  initStore().then(function (st) {
    store = st; S.mode = st.mode; S.blocked = !!st.blocked;
    Object.keys(st.docs).forEach(function (id) { if (!S.docs[id]) S.docs[id] = st.docs[id]; });
    if (S.day === dayForDate(S.date)) S.day = dayFor(S.date);
    if (BK.url) { if (S.bkNew) setStatus("Backup automático ligado"); bkSoon(); }
    if (S.mode === "db") migrateFotos();
    var active = document.activeElement, typing = active && active.matches && active.matches("input[data-f]");
    if (!typing) render(); else setStatus(S.mode === "local" ? "Salvando só neste aparelho" : "Salvo na sua conta");
    Object.keys(S.pending).forEach(function (id) { scheduleSave(id); });
    S.pending = {};
  });
})();
</script>
